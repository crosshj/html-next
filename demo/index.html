<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>HTMLNext Test</title>
		<link
			rel="icon"
			type="image/svg+xml"
			href="./favicon.svg"
		/>
		<!-- vendor css and js-->
		<link
			rel="stylesheet"
			href="./vendor/inter.css"
		/>

		<!-- old version of font awesome -->
		<!-- <link
			rel="stylesheet"
			href="./vendor/font-awesome.css"
		/> -->

		<!-- fork of font awesome -->
		<!-- <link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/fork-awesome@1.2.0/css/fork-awesome.min.css"
			integrity="sha256-XoaMnoYC5TH6/+ihMEnospgm0J1PM/nioxbOUdnM8HY="
			crossorigin="anonymous"
		/> -->

		<!-- new version of font awesome -->
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
		/>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/v4-shims.min.css"
		/>

		<link
			rel="stylesheet"
			href="./vendor/highlightjs/github-dark.min.css"
			media="(prefers-color-scheme: dark)"
		/>
		<link
			id="hljs-theme"
			rel="stylesheet"
			href="./vendor/highlightjs/github.min.css"
			media="(prefers-color-scheme: light)"
		/>
		<script src="./vendor/highlightjs/highlight.min.js"></script>

		<!-- framework and demo css -->
		<link
			rel="stylesheet"
			href="./dist/htmlNext.css"
		/>
		<link
			rel="stylesheet"
			href="./index.css"
		/>
		<link
			rel="stylesheet"
			href="./pages/dashboard.css"
		/>
	</head>
	<body class="test-framework">
		<x-data
			name="appContent"
			url="./app.html"
			defaultValue=""
		></x-data>

		<x-fragment
			contents="global_appContent"
			showLoading="false"
		></x-fragment>

		<script type="module">
			import {
				initializeFramework,
				registerComponentHook,
			} from './dist/htmlNext.js?v=2';
			initializeFramework();

			// Register a hook for x-markdown components to enable syntax highlighting
			registerComponentHook('x-markdown', (component) => {
				if (typeof hljs !== 'undefined') {
					hljs.highlightAll();
				}
			});

			// FOUC Prevention - Show content after framework loads
			document.body.classList.add('framework-loaded');

			window.addUser = () => alert('Add User Clicked');
		</script>
	</body>
</html>
