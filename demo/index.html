<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>HTMLNext Test</title>
		<link
			rel="icon"
			type="image/svg+xml"
			href="./favicon.svg"
		/>
		<!-- Load fonts locally for development -->
		<link
			rel="stylesheet"
			href="./vendor/inter.css"
		/>
		<link
			rel="stylesheet"
			href="./vendor/font-awesome.css"
		/>
		<link
			rel="stylesheet"
			href="./dist/htmlNext.css"
		/>
		<!-- <link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/@crosshj/html-next@latest/dist/htmlNext.css"
		/> -->
		<link
			rel="stylesheet"
			href="./index.css"
		/>
		<link
			rel="stylesheet"
			href="./pages/dashboard.css"
		/>
	</head>
	<body class="test-framework">
		<x-fragment
			contents="global_appContent"
			showLoading="false"
		></x-fragment>

		<script type="module">
			import { initializeFramework, setState } from './dist/htmlNext.js?v=2';
			// import {
			// 	initializeFramework,
			// 	setState,
			// } from 'https://cdn.jsdelivr.net/npm/@crosshj/html-next@latest/dist/htmlNext.js';
			initializeFramework();

			setState('menuItems', [
				{
					label: 'Dashboard',
					href: '/dashboard',
					icon: 'fa-tachometer',
				},
				{ label: 'Users', href: '/users', icon: 'fa-users' },
				{ label: 'Features', href: '/features', icon: 'fa-star' },
			]);

			const userProfile = {
				name: 'Sarah Johnson',
				email: 'sarah.johnson@clientinc.com',
				role: 'Senior Developer',
				department: 'Engineering',
				joinDate: 'March 15, 2023',
				lastLogin: '15 minutes ago',
				avatar: '/assets/test_user.png',
			};

			setState('menuItemsBottom', [
				{
					label: userProfile.name,
					href: '/profile',
					avatar: userProfile.avatar,
					hasAvatar: true,
				},
				{ label: 'Settings', href: '/settings', icon: 'fa-cog' },
				{ label: 'Logout', href: '/logout', icon: 'fa-sign-out' },
			]);

			// Profile page data
			setState('userProfile', userProfile);

			setState('profileStats', [
				{
					label: 'Projects Completed',
					value: '42',
					icon: 'fa-check-circle',
					color: 'var(--paletteSuccessMain)',
				},
				{
					label: 'Tasks Assigned',
					value: '89',
					icon: 'fa-tasks',
					color: 'var(--paletteInfoMain)',
				},
				{
					label: 'Team Members',
					value: '12',
					icon: 'fa-users',
					color: 'var(--palettePrimaryMain)',
				},
				{
					label: 'Days Active',
					value: '234',
					icon: 'fa-calendar',
					color: 'var(--paletteWarningMain)',
				},
			]);

			const appContent = await fetch('./app.html').then((response) =>
				response.text()
			);
			setState('appContent', appContent);

			// FOUC Prevention - Show content after framework loads
			document.body.classList.add('framework-loaded');

			window.addUser = () => alert('Add User Clicked');
		</script>
	</body>
</html>
