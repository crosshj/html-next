<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>HTMLNext Test</title>
		<link
			rel="icon"
			type="image/svg+xml"
			href="./favicon.svg"
		/>
		<!-- vendor css and js-->
		<link
			rel="stylesheet"
			href="./vendor/inter.css"
		/>

		<!-- new version of font awesome -->
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
		/>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/v4-shims.min.css"
		/>

		<link
			rel="stylesheet"
			href="./vendor/highlightjs/github-dark.min.css"
			media="(prefers-color-scheme: dark)"
		/>
		<link
			id="hljs-theme"
			rel="stylesheet"
			href="./vendor/highlightjs/github.min.css"
			media="(prefers-color-scheme: light)"
		/>
		<script src="./vendor/highlightjs/highlight.min.js"></script>

		<!-- framework and demo css -->
		<link
			rel="stylesheet"
			href="./dist/htmlNext.css"
		/>
		<link
			rel="stylesheet"
			href="./index.css"
		/>
		<link
			rel="stylesheet"
			href="./pages/dashboard.css"
		/>
	</head>
	<body class="test-framework">
		<x-data
			name="appContent"
			url="./app.html"
			defaultValue=""
		></x-data>

		<x-fragment
			contents="global_appContent"
			showLoading="false"
		></x-fragment>

		<script type="module">
			import { initializeFramework, Router, SetData } from './dist/htmlNext.js';

			const cache = new Map();
			const fetchPage = async (path) => {
				if (cache.has(path)) return cache.get(path);
				try {
					const response = await fetch(`./pages/${path}.html`);
					const result = await response.text().then((x) => x.trim());
					if (!result.trim()) {
						throw new Error('Page not found');
					} else {
						cache.set(path, result.trim());
						return result.trim();
					}
				} catch (error) {
					console.error(`Failed to fetch page from ${path}:`, error);
					if (path === '404') {
						return '<x-page><x-content><x-markdown>Fetch page: Not Found</x-markdown></x-content></x-page>';
					}
					return await fetchPage('404');
				}
			};
			const fetchData = async (path, defaultValue = {}) => {
				if (cache.has(path)) return cache.get(path);
				try {
					const response = await fetch(`./data/${path}`);
					const result = await response.json();
					cache.set(path, result);
					return result;
				} catch (error) {
					console.error(`Failed to fetch JSON from ${path}:`, error);
				}
			};

			const routerSetup = async () => {
				const initialHash = window.location.hash || '#/dashboard';
				const initialPath = initialHash.replace(/^#/, '');

				return Router({
					initialPath,
					beforeEach: async (context) => {
						const path = context.to.href;
						await SetData('mainContent', await fetchPage(path));
					},
					afterEach: async (context) => {
						const path = context.to.href;
						document.querySelectorAll('.menuItem.active').forEach((button) => {
							button.classList.remove('active');
						});
						const menuItems = document.querySelectorAll('.menuItem');
						for (const item of menuItems) {
							const href = item.getAttribute('href');
							if (!path.startsWith(href)) continue;
							item.classList.add('active');
						}
						document.getElementById('sidebar')?.classList?.remove('open');

						// Handle navigation after all other updates
						window.location.hash = context.to.path;
					},
				});
			};

			(async () => {
				const router = await routerSetup();
				const menuData = await fetchData('menu-data.json', {
					top: [],
					bottom: [],
				});
				const state = {
					mainContent: '',
					menuItems: menuData.top,
					menuItemsBottom: menuData.bottom,
				};
				const hooks = {
					'x-markdown': (component) => {
						if (typeof hljs === 'undefined') return;

						const codeBlocks = component.querySelectorAll('pre code');
						for (const codeBlock of codeBlocks) {
							hljs.highlightElement(codeBlock);
						}
					},
				};
				await initializeFramework({ router, state, hooks });
				document.body.classList.add('framework-loaded');

				window.addUser = () =>
					alert('addUser called - this is just an example');
			})();
		</script>
	</body>
</html>
