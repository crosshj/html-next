		<script type="module">
			import * as framework from './dist/htmlNext.js';
			import helpers from './dist/htmlNext.helpers.js';

			// your menu items
			const getMenu = ({ user } = {}) => {
				const menuItems = [
					{
						label: 'Dashboard',
						icon: 'fa-tasks',
						path: '/dashboard',
					},
					{
						label: 'Users',
						path: '/users',
						icon: 'fa-users',
					},
					{
						label: 'Features',
						path: '/features',
						icon: 'fa-star',
					},
					{ spacer: true },
					{
						path: '/profile',
						label:
							user?.user_metadata?.displayName || user?.email || 'User Profile',
						avatar: './assets/test_user.png',
						hasAvatar: true,
					},
					{
						path: '/settings',
						label: 'Settings',
						icon: 'fa-cog',
					},
					{
						path: '/logout',
						label: 'Logout',
						icon: 'fa-sign-out',
					},
				];
				return menuItems;
			};

			// basic framework setup
			const logoHTML = document.getElementById('logoHTML').innerHTML;
			const getFragment = async (path) => await fetch(`./pages/${path}.html`);
			const getData = async (path) => await fetch(`./data/${path}`);
			const defaultHash = '/dashboard';
			const authSetup = () => {
				const STORAGE_KEY = 'demo_auth_session';

				return {
					signUp: async (email, password) => {
						const session = {
							email,
							user: {
								user_metadata: {
									id: `user-${Date.now()}`,
									email,
									avatar: './assets/test_user.png',
									displayName: 'Demo User',
									bio: 'This is a demo user account.',
								},
							},
						};
						localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
						return { data: { session } };
					},
					signIn: async (email, password) => {
						const session = {
							user: {
								email,
								user_metadata: {
									id: `user-${Date.now()}`,
									email,
									avatar: './assets/test_user.png',
									displayName: 'Demo User',
									bio: 'This is a demo user account.',
								},
							},
						};
						localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
						return { data: { session } };
					},
					signOut: async () => {
						localStorage.removeItem(STORAGE_KEY);
						return {};
					},
					getSession: async () => {
						const stored = localStorage.getItem(STORAGE_KEY);
						if (stored) {
							return { data: { session: JSON.parse(stored) } };
						}
						return { data: { session: null } };
					},
					onAuthChange: (callback) => {
						const stored = localStorage.getItem(STORAGE_KEY);
						callback(stored ? JSON.parse(stored) : null);
					},
					updateUserMetadata: async (data) => {
						const stored = localStorage.getItem(STORAGE_KEY);
						if (stored) {
							const session = JSON.parse(stored);
							session.user = { ...session.user, ...data };
							localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
							return { data: { user: session.user } };
						}
						return { error: 'No session found' };
					},
				};
			};

			const hooks = {
				'x-markdown': (component) => {
					if (typeof hljs === 'undefined') return;

					const codeBlocks = component.querySelectorAll('pre code');
					for (const codeBlock of codeBlocks) {
						hljs.highlightElement(codeBlock);
					}
				},
			};

			// that's it! initialize the framework
			await helpers.pages.enhanced({
				framework,
				hooks,
				logoHTML,
				defaultHash,
				authSetup,
				getFragment,
				getData,
				getMenu,
			});

			// example global function, see dashboard page for usage
			window.addUser = () => alert('Add User Clicked');
		</script>
