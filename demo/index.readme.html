<!DOCTYPE html>
<html>
	<head>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
		/>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/@crosshj/html-next@latest/dist/htmlNext.css"
		/>
	</head>
	<!-- prettier-ignore -->
	<style>
		/* custom theme colors */
		:root body {
			--palettePrimaryMain: #007bff;
			--palettePrimaryLight: #66b3ff;
			--palettePrimaryDark: #0056b3;
		}
		body {
			padding-top: 4em;
			height: 100vh;
			width: 100vw;
		}
		.loading { visibility: hidden; }
		.flex-row-gap-1 { display: flex; gap: 1em; }
		.flex-column-gap-1 { display: flex; flex-direction: column; gap: 1em; }
		.align-center { align-items: center; }
		.justify-center { justify-content: center; }
		x-fragment pre { margin: 0; min-width: 5em; }
	</style>
	<body class="loading flex-column-gap-1 align-center">
		<x-data
			name="count"
			defaultValue="0"
		></x-data>

		<script
			data-key="increment"
			type="application/flow"
		>
			SetState('count', ++state.count);
		</script>

		<script
			data-key="decrement"
			type="application/flow"
		>
			SetState('count', --state.count);
		</script>

		<x-typography variant="h1">Count Demo</x-typography>
		<x-box class="flex-row-gap-1">
			<x-button
				handler="decrement"
				icon="fa-minus"
				sx:height="100%"
			>
			</x-button>
			<x-fragment
				contents="global_count"
				class="flex-row-gap-1 justify-center"
			></x-fragment>
			<x-button
				handler="increment"
				icon="fa-plus"
				sx:height="100%"
			>
			</x-button>
		</x-box>

		<script type="module">
			import { initializeFramework } from './dist/htmlNext.js';
			initializeFramework();
			document.body.classList.remove('loading');
		</script>
	</body>
</html>
